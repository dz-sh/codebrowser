map $sent_http_content_type $codebrowser_cache_control {
    ~^text/html "no-cache";
    default "";
}

server {
    listen 80;
    server_name _;

    root /srv/codebrowser/public;
    index index.html;

    location = /theme/modern-v1.css {
        alias /srv/codebrowser-theme/modern-v1.css;
        default_type text/css;
        add_header Cache-Control "no-cache";
    }

    location /views/ {
        add_header Cache-Control $codebrowser_cache_control always;
        sub_filter '</head>' '<link rel="stylesheet" href="/theme/modern-v1.css"></head>';
        sub_filter_once on;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
