name: Image test

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - docker/**
      - themes/**
      - tests/web/**
      - LICENSE
      - src/codebrowser_control.py
      - .github/workflows/image-test.yml
      - .github/workflows/image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - docker/**
      - themes/**
      - tests/web/**
      - LICENSE
      - src/codebrowser_control.py
      - .github/workflows/image-test.yml
      - .github/workflows/image.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test optional web theme
        run: |
          docker run --detach --name codebrowser-web-test \
            --publish 127.0.0.1:18080:80 \
            --volume "$PWD/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            --volume "$PWD/tests/web/public:/srv/codebrowser/public:ro" \
            --volume "$PWD/themes/modern:/srv/codebrowser-theme:ro" \
            nginx:1.30.4-alpine3.24
          trap 'docker rm --force codebrowser-web-test' EXIT
          for attempt in 1 2 3 4 5; do
            curl --fail --silent --dump-header /tmp/view.headers \
              http://127.0.0.1:18080/views/demo/ > /tmp/view.html && break
            sleep 1
          done
          grep --ignore-case --fixed-strings 'Cache-Control: no-cache' /tmp/view.headers
          grep --ignore-case --fixed-strings 'Last-Modified:' /tmp/view.headers
          grep --fixed-strings '<link rel="stylesheet" href="data/indexstyle.css">' /tmp/view.html
          grep --fixed-strings '<link rel="stylesheet" href="/theme/modern-v1.css">' /tmp/view.html
          if curl --fail --silent http://127.0.0.1:18080/ | grep --quiet '/theme/modern-v1.css'; then
            exit 1
          fi
          curl --fail --silent --dump-header /tmp/theme.headers \
            http://127.0.0.1:18080/theme/modern-v1.css > /tmp/theme.css
          grep --ignore-case --fixed-strings 'Cache-Control: no-cache' /tmp/theme.headers
          grep --quiet --fixed-strings -- '--cb-blue: #0077c8' /tmp/theme.css
          grep --quiet --fixed-strings -- '.code .inactive-code' /tmp/theme.css
          grep --quiet --fixed-strings -- '.code .inlayHint' /tmp/theme.css
          grep --quiet --fixed-strings -- '.search-status' /tmp/theme.css
          grep --quiet --fixed-strings -- '#allSideBoxes #historySideBox' /tmp/theme.css
