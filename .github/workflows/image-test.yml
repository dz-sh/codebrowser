name: Image test

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - LICENSE
      - src/codebrowser_control.py
      - .github/workflows/image-test.yml
      - .github/workflows/image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - LICENSE
      - src/codebrowser_control.py
      - .github/workflows/image-test.yml
      - .github/workflows/image.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
